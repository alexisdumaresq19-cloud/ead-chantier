<!doctype html>
<!--
  The page Capacitor requires in the app's own files (capacitor.config.ts,
  webDir). The app opens the site directly, so this is never seen; if it
  ever is, it goes to the site. ios-shell/build.mjs fills in the address and
  the logo.
-->
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>EAD</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0d10;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 200px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="__EAD_LOGO__" width="752" height="560" alt="Les Entreprises Allen Dumaresq" />
    <script>
      location.replace("__EAD_SITE__/");
    </script>
  </body>
</html>
